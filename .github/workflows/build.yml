name: Build Librespot
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Install Dependencies
        run: brew install portaudio

      - name: Checkout/Clone Librespot
        run: |
          git clone --depth 1 https://github.com/librespot-org/librespot.git .

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: |
          export MACOSX_DEPLOYMENT_TARGET=10.12
          cargo build --release --no-default-features --features portaudio-backend,rustls-tls-webpki-roots

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: librespot-macos
          path: target/release/librespot
