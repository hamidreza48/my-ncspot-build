name: Build librespot

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: 

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout librespot source code
        uses: actions/checkout@v4
        with:
          repository: librespot-org/librespot
          ref: dev  # تغییر کرد: از master به dev تغییر یافت
          fetch-depth: 0

      - name: Install Dependencies
        run: brew install portaudio

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --release --no-default-features --features "portaudio-backend,rustls-tls-webpki-roots"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: librespot-macos
          path: target/release/librespot
